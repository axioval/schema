site_name: Axioval Schema
site_description: Vendor-neutral typed authoring and interchange for validation rules
site_url: https://axioval.github.io/schema/
copyright: Copyright &copy; Axioval contributors · AGPL-3.0-or-later

docs_dir: docs
site_dir: site
exclude_docs: |
  AGENTS.md

strict: true

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Start here:
      - Mental model: concepts/layers.md
      - Property addressing: concepts/property-addressing.md
      - Author a package: authoring.md
  - Tutorial:
      - DIN 276 KG 331 wall: tutorials/din-276-331.md
  - Reference:
      - Schema surface: reference/schema.md
      - Package contract: package-contract.md
  - Project:
      - GitHub repository: https://github.com/axioval/schema
      - Contributing: community/contributing.md
      - Changelog: community/changelog.md
      - Roadmap: community/roadmap.md
      - License: community/license.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/axioval
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/GeneralPawz
