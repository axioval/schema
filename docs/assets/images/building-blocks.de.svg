<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Vier Bausteine von Axioval</title><desc id="desc">Wörterbuch, Rezept, ausgefüllte Karte und Paket wirken zusammen.</desc>
  <defs><style>.n{font:700 13px system-ui,sans-serif;letter-spacing:.08em;fill:#3867b2}.h{font:700 19px system-ui,sans-serif;fill:#172033}.t{font:14px system-ui,sans-serif;fill:#536176}.card{fill:#fff;stroke:#cad8e8;stroke-width:2}.circle{fill:#e9f2ff;stroke:#3867b2;stroke-width:2}</style></defs><rect width="1080" height="380" rx="28" fill="#f5f8fc"/>
  <g transform="translate(35 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M96 53h19c9 0 14 5 14 13v27c-4-4-9-6-14-6H96zM134 53h-19c-9 0-14 5-14 13v27c4-4 9-6 14-6h19z" fill="none" stroke="#3867b2" stroke-width="3"/><text class="n" x="22" y="138">1. WÖRTERBUCH</text><text class="h" x="22" y="173">Klare Begriffe</text><text class="t" x="22" y="205">Was ist eine Wand?</text><text class="t" x="22" y="228">Was bedeutet außen?</text></g>
  <g transform="translate(295 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M96 53h38v42H96zM104 64h22M104 75h22M104 86h14" fill="none" stroke="#3867b2" stroke-width="3" stroke-linecap="round"/><text class="n" x="22" y="138">2. REZEPT</text><text class="h" x="22" y="173">Art der Prüfung</text><text class="t" x="22" y="205">Ein Merkmal nachschlagen.</text><text class="t" x="22" y="228">Mit der Antwort vergleichen.</text></g>
  <g transform="translate(555 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M94 52h42v44H94zM102 64h19M102 76h26M102 88h14" fill="none" stroke="#3867b2" stroke-width="3" stroke-linecap="round"/><path d="M124 62l5 5 10-12" fill="none" stroke="#279460" stroke-width="3"/><text class="n" x="22" y="138">3. AUSGEFÜLLTE KARTE</text><text class="h" x="22" y="173">Konkrete Regel</text><text class="t" x="22" y="205">Tragend prüfen.</text><text class="t" x="22" y="228">Die Antwort muss Ja sein.</text></g>
  <g transform="translate(815 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M93 61h44v34H93zM102 52h26l9 9" fill="none" stroke="#3867b2" stroke-width="3" stroke-linejoin="round"/><text class="n" x="22" y="138">4. PAKET</text><text class="h" x="22" y="173">Teilbares Paket</text><text class="t" x="22" y="205">Begriffe und Prüfungen</text><text class="t" x="22" y="228">reisen gemeinsam.</text></g>
</svg>
