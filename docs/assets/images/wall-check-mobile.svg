<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
  <title id="title">Three facts checked for a wall</title><desc id="desc">An object marked 331 is checked to be a wall, load bearing, and external.</desc>
  <defs><style>.t{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.p{font-size:17px;fill:#536176}.k{font-size:15px;font-weight:700;fill:#3867b2;letter-spacing:1px}</style></defs><rect width="640" height="820" rx="30" fill="#f4f8fd"/>
  <rect x="95" y="45" width="450" height="260" rx="24" fill="#edf4fb" stroke="#aac0d9" stroke-width="3"/><rect x="245" y="25" width="150" height="52" rx="26" fill="#3867b2"/><text x="320" y="59" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">331</text>
  <g fill="#fff" stroke="#9eb7d1" stroke-width="2"><rect x="150" y="105" width="150" height="55"/><rect x="315" y="105" width="150" height="55"/><rect x="150" y="175" width="150" height="55"/><rect x="315" y="175" width="150" height="55"/></g><text x="320" y="274" text-anchor="middle" class="t h">One marked object</text><text x="320" y="296" text-anchor="middle" class="t p">The mark chooses what to inspect.</text>
  <text x="70" y="360" class="t k">THREE CLEAR QUESTIONS</text>
  <g fill="#fff" stroke="#cad8e8" stroke-width="2"><rect x="45" y="385" width="550" height="110" rx="18"/><rect x="45" y="515" width="550" height="110" rx="18"/><rect x="45" y="645" width="550" height="110" rx="18"/></g>
  <g fill="#dff6e9" stroke="#4aa879" stroke-width="2"><circle cx="105" cy="440" r="25"/><circle cx="105" cy="570" r="25"/><circle cx="105" cy="700" r="25"/></g><g fill="none" stroke="#24845a" stroke-width="4"><path d="M93 440l9 9 16-19"/><path d="M93 570l9 9 16-19"/><path d="M93 700l9 9 16-19"/></g>
  <g class="t"><text x="150" y="432" class="h">Is it a wall?</text><text x="150" y="462" class="p">The object type must match.</text><text x="150" y="562" class="h">Is it load bearing?</text><text x="150" y="592" class="p">The answer must be yes.</text><text x="150" y="692" class="h">Is it external?</text><text x="150" y="722" class="p">The answer must be yes.</text></g>
</svg>
