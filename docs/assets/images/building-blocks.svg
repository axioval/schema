<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Four building blocks of Axioval</title><desc id="desc">A dictionary, recipe, filled card, and bundle work together.</desc>
  <defs><style>.n{font:700 13px system-ui,sans-serif;letter-spacing:.08em;fill:#3867b2}.h{font:700 23px system-ui,sans-serif;fill:#172033}.t{font:15px system-ui,sans-serif;fill:#536176}.card{fill:#fff;stroke:#cad8e8;stroke-width:2}.circle{fill:#e9f2ff;stroke:#3867b2;stroke-width:2}</style></defs><rect width="1080" height="380" rx="28" fill="#f5f8fc"/>
  <g transform="translate(35 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M96 53h19c9 0 14 5 14 13v27c-4-4-9-6-14-6H96zM134 53h-19c-9 0-14 5-14 13v27c4-4 9-6 14-6h19z" fill="none" stroke="#3867b2" stroke-width="3"/><text class="n" x="22" y="138">1. DICTIONARY</text><text class="h" x="22" y="173">Shared names</text><text class="t" x="22" y="205">What is a wall?</text><text class="t" x="22" y="228">What does external mean?</text></g>
  <g transform="translate(295 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M96 53h38v42H96zM104 64h22M104 75h22M104 86h14" fill="none" stroke="#3867b2" stroke-width="3" stroke-linecap="round"/><text class="n" x="22" y="138">2. RECIPE</text><text class="h" x="22" y="173">Kind of check</text><text class="t" x="22" y="205">Look up a fact.</text><text class="t" x="22" y="228">Compare it with an answer.</text></g>
  <g transform="translate(555 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M94 52h42v44H94zM102 64h19M102 76h26M102 88h14" fill="none" stroke="#3867b2" stroke-width="3" stroke-linecap="round"/><path d="M124 62l5 5 10-12" fill="none" stroke="#279460" stroke-width="3"/><text class="n" x="22" y="138">3. FILLED CARD</text><text class="h" x="22" y="173">One real rule</text><text class="t" x="22" y="205">Check Load bearing.</text><text class="t" x="22" y="228">The answer must be yes.</text></g>
  <g transform="translate(815 55)"><rect class="card" width="230" height="270" rx="20"/><circle class="circle" cx="115" cy="72" r="38"/><path d="M93 61h44v34H93zM102 52h26l9 9" fill="none" stroke="#3867b2" stroke-width="3" stroke-linejoin="round"/><text class="n" x="22" y="138">4. BUNDLE</text><text class="h" x="22" y="173">Ready to share</text><text class="t" x="22" y="205">The names and checks</text><text class="t" x="22" y="228">travel together.</text></g>
