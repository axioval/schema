<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">Sicherer Weg vom Paket zum Prüfwerkzeug</title><desc id="desc">Ein Paket wird geprüft, sicher geöffnet, auf vollständige Bedeutung geprüft und dann an ein Prüfwerkzeug übergeben.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#728197"/></marker><style>.h{font:700 17px system-ui,sans-serif;fill:#172033}.t{font:13px system-ui,sans-serif;fill:#536176}.n{font:700 11px system-ui,sans-serif;letter-spacing:.08em;fill:#3867b2}.b{fill:#fff;stroke:#cad8e8;stroke-width:2}.l{stroke:#728197;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1080" height="300" rx="26" fill="#f5f8fc"/><path class="l" d="M240 150h55M505 150h55M770 150h55"/>
  <g transform="translate(35 60)"><rect class="b" width="205" height="180" rx="18"/><text class="n" x="22" y="38">1. PAKET PRÜFEN</text><text class="h" x="22" y="76">Dateien prüfen</text><text class="t" x="22" y="108">Namen, Versionen</text><text class="t" x="22" y="130">Speicherorte zuerst prüfen.</text></g>
  <g transform="translate(300 60)"><rect class="b" width="205" height="180" rx="18"/><text class="n" x="22" y="38">2. SICHER ÖFFNEN</text><text class="h" x="22" y="76">Zugriff begrenzen</text><text class="t" x="22" y="108">Nur erlaubte Dateien</text><text class="t" x="22" y="130">kurzzeitig lesen.</text></g>
  <g transform="translate(565 60)"><rect class="b" width="205" height="180" rx="18"/><text class="n" x="22" y="38">3. BEDEUTUNG PRÜFEN</text><text class="h" x="22" y="76">Verweise auflösen</text><text class="t" x="22" y="108">Fehlende oder falsche</text><text class="t" x="22" y="130">Teile stoppen den Ablauf.</text></g>
  <g transform="translate(830 60)"><rect class="b" width="215" height="180" rx="18"/><text class="n" x="22" y="38">4. ÜBERGEBEN</text><text class="h" x="22" y="76">Bereit zur Prüfung</text><text class="t" x="22" y="108">Nur geprüfte Informationen</text><text class="t" x="22" y="130">gehen weiter.</text></g>
</svg>
