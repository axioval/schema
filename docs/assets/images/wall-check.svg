<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Three facts checked for a wall</title><desc id="desc">An object marked 331 is checked to be a wall, load bearing, and external.</desc>
  <defs><style>.h{font:700 24px system-ui,sans-serif;fill:#172033}.t{font:16px system-ui,sans-serif;fill:#536176}.small{font:700 13px system-ui,sans-serif;letter-spacing:.08em;fill:#3867b2}.box{fill:#fff;stroke:#cad8e8;stroke-width:2}.ok{fill:#e7f8ef;stroke:#279460;stroke-width:2}</style></defs>
  <rect class="diagram-canvas" width="1000" height="430" rx="28" fill="#f5f8fc"/>
  <g transform="translate(60 55)"><rect x="0" y="45" width="310" height="255" rx="18" fill="#eaf1f8" stroke="#9db0c5" stroke-width="2"/><g fill="#fff" stroke="#7891aa" stroke-width="2"><rect x="35" y="80" width="110" height="44" rx="4"/><rect x="155" y="80" width="110" height="44" rx="4"/><rect x="35" y="134" width="110" height="44" rx="4"/><rect x="155" y="134" width="110" height="44" rx="4"/><rect x="35" y="188" width="110" height="44" rx="4"/><rect x="155" y="188" width="110" height="44" rx="4"/></g><rect x="80" y="0" width="150" height="58" rx="29" fill="#3867b2"/><text x="155" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff">331</text><text class="h" x="155" y="340" text-anchor="middle">One marked object</text><text class="t" x="155" y="370" text-anchor="middle">The mark chooses what to inspect.</text></g>
  <path d="M395 215H455" stroke="#7c8ba1" stroke-width="3"/><path d="M445 207l12 8-12 8" fill="none" stroke="#7c8ba1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(480 45)"><text class="small" x="0" y="12">THREE CLEAR QUESTIONS</text><g transform="translate(0 35)"><rect class="box" width="455" height="92" rx="16"/><circle class="ok" cx="46" cy="46" r="24"/><path d="M35 46l8 8 15-18" fill="none" stroke="#279460" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="h" x="88" y="40">Is it a wall?</text><text class="t" x="88" y="67">The object type must match.</text></g><g transform="translate(0 145)"><rect class="box" width="455" height="92" rx="16"/><circle class="ok" cx="46" cy="46" r="24"/><path d="M35 46l8 8 15-18" fill="none" stroke="#279460" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="h" x="88" y="40">Is it load bearing?</text><text class="t" x="88" y="67">The answer must be yes.</text></g><g transform="translate(0 255)"><rect class="box" width="455" height="92" rx="16"/><circle class="ok" cx="46" cy="46" r="24"/><path d="M35 46l8 8 15-18" fill="none" stroke="#279460" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="h" x="88" y="40">Is it external?</text><text class="t" x="88" y="67">The answer must be yes.</text></g></g>
</svg>
