<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1020" role="img" aria-labelledby="title desc">
  <title id="title">Vier Bausteine von Axioval</title><desc id="desc">Wörterbuch, Rezept, ausgefüllte Karte und Paket wirken zusammen.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7891ad"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#172033}.k{font-size:15px;font-weight:700;fill:#3867b2;letter-spacing:1px}.h{font-size:26px;font-weight:700}.p{font-size:18px;fill:#536176}.n{font-size:18px;font-weight:700;fill:#3867b2}</style></defs>
  <rect class="diagram-canvas" width="640" height="1020" rx="32" fill="#f4f8fd"/>
  <g fill="#fff" stroke="#cad8e8" stroke-width="2">
    <rect x="35" y="35" width="570" height="190" rx="24"/><rect x="35" y="285" width="570" height="190" rx="24"/><rect x="35" y="535" width="570" height="190" rx="24"/><rect x="35" y="785" width="570" height="190" rx="24"/>
  </g>
  <g stroke="#7891ad" stroke-width="4" marker-end="url(#arrow)"><path d="M320 235v34"/><path d="M320 485v34"/><path d="M320 735v34"/></g>
  <g class="t"><circle cx="100" cy="130" r="42" fill="#e9f1ff" stroke="#7aa2db" stroke-width="2"/><path d="M78 118h44M78 130h44M78 142h30" stroke="#3867b2" stroke-width="4"/><text x="165" y="88" class="k">TEIL 1</text><text x="165" y="125" class="h">Wörterbuch</text><text x="165" y="157" class="p">Gemeinsame Begriffe für</text><text x="165" y="183" class="p">Dinge und Merkmale.</text>
  <circle cx="100" cy="380" r="42" fill="#e9f1ff" stroke="#7aa2db" stroke-width="2"/><path d="M80 382l13 13 28-32" fill="none" stroke="#3867b2" stroke-width="5"/><text x="165" y="338" class="k">TEIL 2</text><text x="165" y="375" class="h">Rezept</text><text x="165" y="407" class="p">Was geprüft wird</text><text x="165" y="433" class="p">und was erfüllt sein muss.</text>
  <circle cx="100" cy="630" r="42" fill="#e9f1ff" stroke="#7aa2db" stroke-width="2"/><rect x="80" y="610" width="40" height="40" rx="4" fill="none" stroke="#3867b2" stroke-width="4"/><path d="M88 600h40v40" fill="none" stroke="#3867b2" stroke-width="4"/><text x="165" y="588" class="k">TEIL 3</text><text x="165" y="625" class="h">Ausgefüllte Karte</text><text x="165" y="657" class="p">Projektangaben</text><text x="165" y="683" class="p">vervollständigen das Rezept.</text>
  <circle cx="100" cy="880" r="42" fill="#e9f1ff" stroke="#7aa2db" stroke-width="2"/><rect x="77" y="862" width="46" height="32" rx="4" fill="none" stroke="#3867b2" stroke-width="4"/><path d="M90 904h20M100 894v10" stroke="#3867b2" stroke-width="4"/><text x="165" y="838" class="k">TEIL 4</text><text x="165" y="875" class="h">Paket</text><text x="165" y="907" class="p">Alle Teile</text><text x="165" y="933" class="p">zum Teilen zusammenhalten.</text></g>
</svg>
