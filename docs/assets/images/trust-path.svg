<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">Safe path from package to checking tool</title><desc id="desc">A package is inspected, opened in a safe space, checked for complete meaning, and then handed to a checking tool.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#728197"/></marker><style>.h{font:700 19px system-ui,sans-serif;fill:#172033}.t{font:14px system-ui,sans-serif;fill:#536176}.n{font:700 12px system-ui,sans-serif;letter-spacing:.08em;fill:#3867b2}.b{fill:#fff;stroke:#cad8e8;stroke-width:2}.l{stroke:#728197;stroke-width:3;marker-end:url(#a)}</style></defs><rect class="diagram-canvas" width="1080" height="300" rx="26" fill="#f5f8fc"/><path class="l" d="M240 150h55M505 150h55M770 150h55"/>
  <g transform="translate(35 60)"><rect class="b" width="205" height="180" rx="18"/><text class="n" x="22" y="38">1. READ THE LABEL</text><text class="h" x="22" y="76">Inspect files</text><text class="t" x="22" y="108">Check names, versions,</text><text class="t" x="22" y="130">and file locations first.</text></g>
  <g transform="translate(300 60)"><rect class="b" width="205" height="180" rx="18"/><text class="n" x="22" y="38">2. OPEN SAFELY</text><text class="h" x="22" y="76">Limit access</text><text class="t" x="22" y="108">Read only the allowed</text><text class="t" x="22" y="130">files for a short time.</text></g>
  <g transform="translate(565 60)"><rect class="b" width="205" height="180" rx="18"/><text class="n" x="22" y="38">3. CHECK MEANING</text><text class="h" x="22" y="76">Resolve every link</text><text class="t" x="22" y="108">Missing or conflicting</text><text class="t" x="22" y="130">parts stop the process.</text></g>
  <g transform="translate(830 60)"><rect class="b" width="215" height="180" rx="18"/><text class="n" x="22" y="38">4. HAND OVER</text><text class="h" x="22" y="76">Ready for a tool</text><text class="t" x="22" y="108">Only checked information</text><text class="t" x="22" y="130">moves to the next step.</text></g>
</svg>
