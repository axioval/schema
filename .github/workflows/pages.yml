name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy documentation
    # GitHub Pages deployment requires these only for this job.
    permissions:
      contents: read
      pages: write # Publish the built artifact to GitHub Pages.
      id-token: write # Authenticate the deployment through GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Pkl
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0.0.9
        with:
          pkl-version: 0.32.1

      - name: Validate package contract
        run: ./scripts/check.sh

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build documentation (strict)
        run: |
          python -m pip install --disable-pip-version-check mkdocs==1.6.1 mkdocs-material==9.6.20
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
