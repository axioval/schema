name: validate

on:
  push:
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    name: Validate schema and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pkl
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0.0.9
        with:
          pkl-version: 0.32.1
      - name: Validate schema and examples
        run: ./scripts/check.sh

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Build documentation (strict)
        run: |
          python -m pip install --disable-pip-version-check mkdocs==1.6.1 mkdocs-material==9.6.20
          mkdocs build --strict
